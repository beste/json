name: Tests

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/tests.yml'
      - 'composer.json'
      - 'phpstan.neon.dist'
      - 'phpunit.xml.dist'
      - 'rector.php'
  push:
    branches: ['main']
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/tests.yml'
      - 'composer.json'
      - 'phpstan.neon.dist'
      - 'phpunit.xml.dist'
      - 'rector.php'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        php:
          - "8.1"
          - "8.2"
          - "8.3"
          - "8.4"
          - "8.5"
          - "8.6"

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          tools: composer
          coverage: ${{ matrix.php == '8.6' && 'xdebug' || 'none' }}
        env:
          COMPOSER_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate composer.json
        if: ${{ matrix.php == '8.6' }}
        run: composer validate --strict

      - name: Install dependencies with Composer
        run: composer install --no-interaction --no-progress --ansi

      - name: Run Composer Audit
        if: ${{ matrix.php == '8.6' }}
        run: composer audit --no-interaction --format=table --abandoned=report --ansi

      - name: Setup Problem Matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Run PHPStan
        run: XDEBUG_MODE=off vendor/bin/phpstan analyse --no-progress --error-format=github

      - name: Run Rector
        if: ${{ matrix.php == '8.6' }}
        run: XDEBUG_MODE=off vendor/bin/rector --dry-run --ansi --no-progress-bar

      - name: Run PHPUnit
        run: vendor/bin/phpunit --testdox ${{ matrix.php == '8.6' && '--coverage-text' || '' }}
